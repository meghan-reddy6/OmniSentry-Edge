system:
  mode: "hardware"              # 'hardware' or 'simulation'
  log_level: "INFO"
  enable_diagnostics_stream: true
  diagnostics_port: 8080
  diagnostics_host: "0.0.0.0"

vision:
  camera:
    index: 2
    width: 1280
    height: 720
    fps: 30
    fourcc: "MJPG"
    flip_horizontal: false
    flip_vertical: false

  npu:
    model_path: "models/yolov8_det.onnx"
    backend_type: "htp"
    performance_mode: "burst"
    profiling_level: "off"
    intra_op_threads: 2
    inter_op_threads: 1
    input_width: 640
    input_height: 640

  tracking:
    conf_threshold: 0.40
    nms_iou_threshold: 0.45
    inference_fps_limit: 20

audio:
  hardware:
    device_index: null       # null defaults to ALSA default; or set to specific card index
    sample_rate: 16000       # Sensor sample rate (typically 16000 or 48000)
    channels: 2              # Stereo dual-mic array
    chunk_size: 1024         # Buffer read size
    mic_distance_meters: 0.065 # Physical separation between mic capsules (e.g., 65mm)

  kws:
    model_path: "models/kws_model.onnx"
    confidence_threshold: 0.78
    window_duration_sec: 1.0
    slide_interval_sec: 0.20
    target_labels: ["hey_ruby"]
    execution_provider: "QNNExecutionProvider" # Fallbacks to CPUExecutionProvider

servos:
  mode: "hardware"
  i2c_bus: 1
  i2c_address: 0x40
  pwm_frequency: 50

  pan:
    channel: 0
    min_angle: 5
    max_angle: 175
    base_angle: 90
    invert: false

  tilt:
    channel: 1
    min_angle: 45
    max_angle: 125
    base_angle: 75
    invert: false

  tracking:
    deadband_x: 0.10
    deadband_y: 0.10
    kp_pan: 2.5
    kd_pan: 0.50
    kp_tilt: 2.0
    kd_tilt: 0.40
    max_step_deg: 5.0
    min_breakaway_deg: 0.0
    update_interval_sec: 0.045
    jog_step_deg: 4.0

orchestrator:
  auto_track_speaker: false
  default_prompt: null
  lost_target_timeout_sec: 2.5
  seek_speed_deg_per_sec: 120.0
