system:
  mode: "hardware"              # 'hardware' or 'simulation'
  log_level: "INFO"
  enable_diagnostics_stream: true
  diagnostics_port: 8080
  diagnostics_host: "0.0.0.0"

vision:
  camera:
    index: 0
    width: 640
    height: 480
    fps: 30
    fourcc: ""
    flip_horizontal: false
    flip_vertical: false

  npu:
    model_path: "models/yolov8_det.onnx"
    backend_type: "htp"
    performance_mode: "burst"
    profiling_level: "off"
    intra_op_threads: 2
    inter_op_threads: 1
    input_width: 640
    input_height: 640

  tracking:
    conf_threshold: 0.40
    nms_iou_threshold: 0.45
    inference_fps_limit: 20

audio:
  device_index: null            # null = auto-detect active microphone
  sample_rate: 16000
  channels: 2
  chunk_size: 1024
  mic_distance_meters: 0.065
  vad_threshold_db: -20.0
  min_confidence: 0.45
  cooldown_sec: 0.25
  calibrate_ambient_noise: true

servos:
  mode: "hardware"
  i2c_bus: 1
  i2c_address: 0x40
  pwm_frequency: 50             # Crucial: 50Hz for stable servo holding torque

  pan:
    channel: 0
    min_angle: 10
    max_angle: 170
    base_angle: 90
    invert: false

  tilt:
    channel: 1
    min_angle: 50
    max_angle: 100
    base_angle: 70
    invert: false

  # Minimum 8% deadband to stop oscillations around target center
  deadband: 0.08

orchestrator:
  auto_track_speaker: false
  default_prompt: null
  lost_target_timeout_sec: 2.5
  seek_speed_deg_per_sec: 120.0
