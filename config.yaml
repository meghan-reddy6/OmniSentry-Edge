# System Configuration for RubikPi 3 Audio-Visual Sensing and Tracking Head

# When True, the software uses mock drivers for PyAudio, PCA9685, SMBus2 and ONNX Runtime.
# Allows testing and execution on standard development environments without QCS6490 hardware.
simulation_mode: False

# Microphone array acquisition settings
audio:
  sample_rate: 16000
  channels: 2
  chunk_size: 1024
  vad_threshold_db: -45.0  # Decibel energy gate threshold
  mic_distance: 0.08       # Physical distance between mics in meters (8 cm)
  speed_of_sound: 343.0    # Speed of sound in m/s
  enable_voice_commands: true
  asr_backend: "whisper_tiny_onnx"  # Options: "whisper_tiny_onnx" or "keyword_matcher"
  asr_model_path: "models/whisper_tiny_en_int8.onnx"
  wake_phrases: ["track", "find", "locate", "home", "reset"]
  speech_silence_timeout: 0.7  # Seconds of silence after speech before triggering transcription
  enable_wake_word: true
  wake_word: "sentry"
  wake_timeout_seconds: 5.0 # Window to speak command after wake word
  feedback_tone_enabled: true
  feedback_tone_freq: 650 # Hz
  feedback_tone_duration: 0.15 # Seconds
  auto_calibrate_vad: true
  vad_margin_db: 9.0
  fallback_vad_threshold_db: -45.0

# PCA9685 I2C Servo control settings
servo:
  i2c_bus: 1
  pca9685_address: 0x40    # I2C Hex address (64 decimal)
  pan_channel: 0           # PCA9685 servo channel for Pan
  tilt_channel: 1          # PCA9685 servo channel for Tilt
  
  # Physical range motion constraints (safety protection limits)
  pan_min_angle: -90.0
  pan_max_angle: 90.0
  tilt_min_angle: -30.0
  tilt_max_angle: 45.0
  
  # Dual-axis PID controller tracking coefficients
  pan_pid:
    kp: 15.0
    ki: 0.1
    kd: 0.5
  tilt_pid:
    kp: 15.0
    ki: 0.1
    kd: 0.5
    
  # Home/neutral position
  home_pan: 0.0
  home_tilt: 0.0

# OpenCV and NPU-accelerated Vision / VLM parameters
vision:
  tracker_type: "KCF"     # Options: "KCF" (100+ FPS) or "CSRT" (15 FPS, very slow)
  camera_index: 0
  frame_width: 640
  frame_height: 480
  
  # Diagnostic HUD & Preview settings
  enable_preview: true
  preview_mode: "web"      # "web" (MJPEG HTTP stream) or "gui" (cv2.imshow)
  web_port: 8080
  draw_hud: true
  
  # Quantized models paths (converted to INT8 via Qualcomm AI Hub for Hexagon 770 NPU)
  face_model_path: "models/face_detection_yunet_2023mar.onnx"
  vlm_model_path: "models/yolo_world_s_int8.onnx"
  
  # Timeouts and Threshold parameters
  tracking_timeout: 3.0    # Maximum seconds to verify target before resetting
  verify_threshold: 0.5    # Confidence score limit for face verification
