system:
  mode: "simulation"              # 'hardware' or 'simulation'
  log_level: "INFO"
  enable_diagnostics_stream: true
  diagnostics_port: 8080
  diagnostics_host: "0.0.0.0"

vision:
  camera:
    index: 0
    width: 1280
    height: 720
    fps: 30
    fourcc: "MJPG"
    flip_horizontal: false
    flip_vertical: false

  npu:
    model_path: "models/yolov8_det.onnx"
    backend_type: "htp"
    performance_mode: "burst"
    profiling_level: "off"
    intra_op_threads: 2
    inter_op_threads: 1
    input_width: 640
    input_height: 640

  tracking:
    conf_threshold: 0.40
    nms_iou_threshold: 0.45
    inference_fps_limit: 20

audio:
  device_index: 2             # RubikPi 3 capture hardware index
  sample_rate: 16000          # Native INMP441 I2S sampling frequency
  channels: 2                 # Stereo I2S array
  chunk_size: 1024            # 64ms block window
  mic_distance_m: 0.08        # Physical inter-capsule spacing
  vad_gate_rms: 0.045         # Noise floor threshold above motor idle

  kws:
    model_path: "models/kws_model.onnx"
    confidence_threshold: 0.70
    consecutive_hits: 3
    cooldown_sec: 1.5
    input_scale: null          # Set numeric float if INT8/UINT8 quantized
    input_zero_point: null     # Set integer if INT8/UINT8 quantized
    backend: "htp"             # QNN HTP acceleration

servos:
  mode: "hardware"
  i2c_bus: 1
  i2c_address: 0x40
  pwm_frequency: 50
  update_rate_hz: 15          # Max physical update frequency (66ms interval)
  min_angle_change_deg: 1.5   # Physical deadband: suppresses micro-jitter below 1.5 deg

  pan:
    channel: 0
    base_angle: 90
    min_angle: 10
    max_angle: 170
    invert: false

  tilt:
    channel: 1
    base_angle: 75
    min_angle: 40
    max_angle: 125
    invert: true              # Centralized mechanical inversion for tilt axis

  tracking:
    kp_pan: 2.0
    kd_pan: 0.50
    kp_tilt: 1.6
    kd_tilt: 0.40
    deadband_x: 0.12          # 12% frame center deadband to stop visual hunt
    deadband_y: 0.12
    max_step_deg: 2.5
    update_interval_sec: 0.045
    jog_step_deg: 4.0
    loss_recovery:
      enabled: true
      lost_frames_threshold: 6
      search_timeout_sec: 3.5
      sweep_amplitude_deg: 20.0
      sweep_frequency_hz: 0.6

orchestrator:
  auto_track_speaker: false
  default_prompt: null
  lost_target_timeout_sec: 2.5
  seek_speed_deg_per_sec: 120.0
