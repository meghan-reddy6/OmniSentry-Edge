<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSentry-Edge Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.5);
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', Courier, monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
        }

        .header {
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .status-indicator.disconnected {
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }

        .main-content {
            display: flex;
            flex: 1;
            padding: 1.5rem;
            gap: 1.5rem;
            height: calc(100vh - 73px);
            box-sizing: border-box;
        }

        .video-container {
            flex: 2;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        
        .video-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 2;
        }

        .video-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
        }

        .stream-container {
            width: 100%;
            max-width: 640px;
            aspect-ratio: 1 / 1; /* Enforces true 1:1 square display */
            background: #05080f;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

        .stream-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Prevents CSS clipping/cropping */
            display: block;
        }

        .cli-container {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .cli-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .cli-output {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .log-entry {
            word-break: break-all;
        }
        
        .log-entry.system {
            color: var(--text-muted);
        }
        
        .log-entry.user {
            color: var(--accent);
        }
        
        .log-entry.error {
            color: #ef4444;
        }

        .cli-input-wrapper {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 12px 12px;
        }

        .cli-prompt {
            color: var(--accent);
            font-family: var(--font-mono);
            font-weight: bold;
        }

        .cli-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            outline: none;
        }

        .cli-input::placeholder {
            color: rgba(148, 163, 184, 0.4);
        }

        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
            }
            .video-container {
                min-height: 400px;
            }
            .cli-container {
                min-height: 300px;
            }
        }
    
        .btn-mode {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-mode:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .active-mode {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }
        #manual-jog-pad button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        #manual-jog-pad button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1><div id="status-dot" class="status-indicator disconnected"></div> OmniSentry-Edge</h1>
        <div style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-muted);" id="connection-status">Connecting...</div>
    </div>

    <div class="main-content">
        <div class="video-container">
            <div class="video-header">
                <span>MJPEG Stream</span>
                <span>VisionVLMAgent</span>
            </div>
            <div class="stream-container">
                <img id="mjpg-stream" src="/video_feed" alt="OmniSentry Stream" />
            </div>

            <!-- Control Toolbar -->
            <div class="mode-toolbar" style="display: flex; gap: 8px; margin: 12px 0; justify-content: center; flex-wrap: wrap; width: 100%;">
              <button type="button" class="btn-mode" id="btn-auto" onclick="dispatchCommand('mode auto')">Autonomous</button>
              <button type="button" class="btn-mode" id="btn-terminal" onclick="dispatchCommand('mode terminal')">Terminal / Manual</button>
              <button type="button" class="btn-mode" id="btn-vision" onclick="dispatchCommand('mode vision_only')">Vision Only</button>
              <button type="button" class="btn-mode" id="btn-audio" onclick="dispatchCommand('mode audio_only')">Audio Only</button>
              <button type="button" class="btn-mode" id="btn-standby" onclick="dispatchCommand('mode standby')">Standby</button>
              <button type="button" class="btn-mode" id="btn-clear" style="background: #334155;" onclick="dispatchCommand('clear')">Clear Terminal</button>
            </div>

            <!-- Live Audio/Servo Telemetry HUD Under Video -->
            <div id="telemetry-bar" style="display: flex; justify-content: space-around; background: #1e293b; padding: 10px; border-radius: 6px; margin-bottom: 12px; color: #38bdf8; font-family: monospace; font-size: 14px; width: 100%;">
              <span>MODE: <strong id="hud-mode" style="color: #4ade80;">UNKNOWN</strong></span>
              <span>SERVO PAN: <strong id="hud-pan">90°</strong></span>
              <span>SERVO TILT: <strong id="hud-tilt">75°</strong></span>
              <span>LAST AUDIO CUE: <strong id="hud-audio" style="color: #f472b6;">NONE</strong></span>
            </div>

            <div id="manual-jog-pad" style="display: none; text-align: center; margin-bottom: 12px; width: 100%;">
              <div><button type="button" onclick="dispatchCommand('w')" style="padding: 8px 18px;">▲ Up (W)</button></div>
              <div style="margin: 4px 0;">
                <button type="button" onclick="dispatchCommand('a')" style="padding: 8px 18px;">◄ Left (A)</button>
                <button type="button" onclick="dispatchCommand('home')" style="padding: 8px 14px;">Home</button>
                <button type="button" onclick="dispatchCommand('d')" style="padding: 8px 18px;">Right (D) ►</button>
              </div>
              <div><button type="button" onclick="dispatchCommand('s')" style="padding: 8px 18px;">▼ Down (S)</button></div>
            </div>
        </div>

        <div class="cli-container">
            <div class="cli-header">Command Terminal</div>
            <div class="cli-output" id="cli-output">
                <div class="log-entry system">Initializing WebSocket connection...</div>
            </div>
            <div class="cli-input-wrapper">
                <span class="cli-prompt">RubikPi></span>
                <input type="text" class="cli-input" id="cli-input" placeholder="Type 'track cup' or 'home'..." autocomplete="off">
            </div>
        </div>
    </div>

    <script>
        const cliOutput = document.getElementById('cli-output');
        const cliInput = document.getElementById('cli-input');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('connection-status');
        
        let wsClient = null;

        function initCLIWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            wsClient = new WebSocket(`${protocol}//${window.location.host}/ws/cli`);

            wsClient.onopen = () => {
                statusDot.classList.remove('disconnected');
                statusText.textContent = 'Connected';
                renderTerminalLine('WebSocket Connected to EventBus.', 'system');
            };

            wsClient.onmessage = function(event) {
                try {
                    const payload = JSON.parse(event.data);

                    // Channel 1: Strict Terminal Output
                    if (payload.channel === "terminal") {
                        renderTerminalLine(payload.data);
                        return;
                    }

                    // Channel 2: Clear Command
                    if (payload.channel === "control" && payload.action === "clear") {
                        clearTerminalScreen();
                        return;
                    }

                    // Channel 3: Structured Telemetry (DOES NOT TOUCH TERMINAL SCREEN)
                    if (payload.channel === "telemetry") {
                        updateHUD(payload);
                        return;
                    }
                } catch(err) {
                    // Ignore unparseable fragments; NEVER dump them into the terminal
                }
            };

            wsClient.onclose = () => {
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
                renderTerminalLine('Connection lost. Reconnecting in 2s...', 'error');
                setTimeout(initCLIWebSocket, 2000);
            };

            wsClient.onerror = (error) => {
                console.error('WebSocket Error:', error);
            };
        }

        // Guaranteed command execution
        function dispatchCommand(cmdStr) {
            if (wsClient && wsClient.readyState === WebSocket.OPEN) {
                // Send structured JSON so backend parses unambiguously
                wsClient.send(JSON.stringify({ "cmd": cmdStr }));
            } else {
                console.error("WebSocket is not connected.");
                // Fallback: Use the terminal input box and simulate an Enter keypress
                const inputEl = document.querySelector('input[type="text"]') || 
                                document.getElementById('cli-input');
                if (inputEl) {
                    inputEl.value = cmdStr;
                    const enterEvt = new KeyboardEvent('keydown', {
                        key: 'Enter',
                        code: 'Enter',
                        keyCode: 13,
                        which: 13,
                        bubbles: true
                    });
                    inputEl.dispatchEvent(enterEvt);
                }
            }
        }

        function renderTerminalLine(text, type = 'system') {
            const termBox = document.getElementById('cli-output') || 
                            document.querySelector('.cli-output');
            if (!termBox) return;

            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = text;
            termBox.appendChild(entry);
            termBox.scrollTop = termBox.scrollHeight;
        }

        function clearTerminalScreen() {
            const termBox = document.getElementById('cli-output') || 
                            document.querySelector('.cli-output');
            if (termBox) termBox.innerHTML = "";
        }

        function updateHUD(data) {
            if (data.mode) {
                const el = document.getElementById('hud-mode');
                if (el) el.innerText = data.mode;

                // Update active button state
                document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active-mode'));
                const btnId = 'btn-' + data.mode.toLowerCase().replace('_only', '').replace(/[\s_]+/g, '');
                const activeBtn = document.getElementById(btnId);
                if (activeBtn) activeBtn.classList.add('active-mode');

                const manualJog = document.getElementById('manual-jog-pad');
                if (manualJog) manualJog.style.display = (data.mode === 'TERMINAL') ? 'block' : 'none';
            }
            if (data.pan !== undefined) {
                const el = document.getElementById('hud-pan');
                if (el) el.innerText = data.pan + "°";
            }
            if (data.tilt !== undefined) {
                const el = document.getElementById('hud-tilt');
                if (el) el.innerText = data.tilt + "°";
            }
            if (data.audio_cue) {
                const el = document.getElementById('hud-audio');
                if (el) el.innerText = data.audio_cue;
            }
        }

        document.addEventListener("DOMContentLoaded", initCLIWebSocket);

        cliInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const cmd = cliInput.value.trim();
                if (cmd) {
                    renderTerminalLine(`RubikPi> ${cmd}`, 'user');
                    dispatchCommand(cmd);
                    cliInput.value = '';
                }
            }
        });
        
        // Focus input on load
        window.onload = () => {
            cliInput.focus();
        };
    </script>
</body>
</html>
